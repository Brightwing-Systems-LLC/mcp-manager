name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            ext: .exe
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build sidecar binaries
        run: |
          TARGET=${{ matrix.target }}
          EXT=${{ matrix.ext }}
          BINARIES_DIR=src-tauri/binaries
          mkdir -p "$BINARIES_DIR"

          # Create placeholders so build.rs doesn't fail during first pass
          for name in brightwing-authd brightwing-proxy bw; do
            touch "$BINARIES_DIR/${name}-${TARGET}${EXT}"
            chmod +x "$BINARIES_DIR/${name}-${TARGET}${EXT}" 2>/dev/null || true
          done

          # Build the sidecar binaries for the target
          cd src-tauri
          cargo build --release --target "$TARGET" --bin brightwing-authd --bin brightwing-proxy --bin bw
          cd ..

          # Copy built binaries over placeholders
          for name in brightwing-authd brightwing-proxy bw; do
            cp "src-tauri/target/${TARGET}/release/${name}${EXT}" "$BINARIES_DIR/${name}-${TARGET}${EXT}"
            chmod +x "$BINARIES_DIR/${name}-${TARGET}${EXT}" 2>/dev/null || true
          done
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MCP Manager ${{ github.ref_name }}"
          releaseBody: |
            ## Download

            | Platform | File | Status |
            |----------|------|--------|
            | macOS (Apple Silicon) | `Brightwing.MCP.Manager_x.x.x_aarch64.dmg` | Beta |
            | macOS (Intel) | `Brightwing.MCP.Manager_x.x.x_x64.dmg` | Beta |
            | Windows (64-bit) | `Brightwing.MCP.Manager_x.x.x_x64-setup-ALPHA.exe` | **Alpha — expect bugs** |
            | Linux (Debian/Ubuntu) | `Brightwing.MCP.Manager_x.x.x_amd64.deb` | Beta |
            | Linux (AppImage) | `Brightwing.MCP.Manager_x.x.x_amd64.AppImage` | Beta |

            ### Windows Alpha Notice

            The Windows build compiles and installs but has **not been tested on real hardware**. The core UI and config management should work, but the auth daemon, proxy, and CLI shim are unverified on Windows. Please [report issues](https://github.com/Brightwing-Systems-LLC/mcp-manager/issues) if you encounter problems.

            ### Unsigned Build Workarounds

            Builds are not yet code-signed. Your OS will show a warning on first launch.

            **macOS:** System Settings → Privacy & Security → Open Anyway. Or run `xattr -cr "/Applications/Brightwing MCP Manager.app"` in Terminal.

            **Windows:** SmartScreen → More info → Run anyway.

            **Linux AppImage:** `chmod +x` the file, then run it.

            ---

            See [README](https://github.com/Brightwing-Systems-LLC/mcp-manager#readme) for full documentation.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Rename Windows installer to include ALPHA tag
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          OLD_NAME="Brightwing.MCP.Manager_${VERSION}_x64-setup.exe"
          NEW_NAME="Brightwing.MCP.Manager_${VERSION}_x64-setup-ALPHA.exe"
          # Download, rename, re-upload
          gh release download "$TAG" --pattern "$OLD_NAME" --dir /tmp --clobber || true
          if [ -f "/tmp/$OLD_NAME" ]; then
            mv "/tmp/$OLD_NAME" "/tmp/$NEW_NAME"
            gh release upload "$TAG" "/tmp/$NEW_NAME" --clobber
            gh release delete-asset "$TAG" "$OLD_NAME" --yes
          fi

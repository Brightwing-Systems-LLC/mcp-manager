[workspace]
members = [".", "crates/proxy-common"]

[package]
name = "brightwing-mcp-manager"
version = "0.3.15"
description = "Brightwing MCP Manager - Universal MCP server installer"
authors = ["Brightwing Systems"]
edition = "2021"
default-run = "brightwing-mcp-manager"

[lib]
name = "brightwing_mcp_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "brightwing-proxy"
path = "src/bin/brightwing_proxy.rs"

[[bin]]
name = "brightwing-authd"
path = "src/bin/brightwing_authd.rs"

[[bin]]
name = "bw"
path = "src/bin/bw.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
which = "7"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
urlencoding = "2"
proxy-common = { path = "crates/proxy-common", features = ["stronghold"] }
tokio = { version = "1", features = ["full"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
futures = "0.3"
hostname = "0.4"
whoami = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"

name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Create sidecar placeholders
        run: |
          TARGET=$(rustc -vV | grep '^host:' | awk '{print $2}')
          mkdir -p src-tauri/binaries
          for name in brightwing-authd brightwing-proxy bw; do
            touch "src-tauri/binaries/${name}-${TARGET}"
            chmod +x "src-tauri/binaries/${name}-${TARGET}"
          done

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test
